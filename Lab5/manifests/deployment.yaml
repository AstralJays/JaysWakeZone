# Reference — Terraform applies equivalent via kubernetes_* resources.
# Default public image; override only for forks.
# WakeBot (CPU) talks to in-cluster Ollama (GPU) at http://ollama:11434/v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwz-agent-lab
  labels:
    app: jwz-agent-lab
    lab: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwz-agent-lab
  template:
    metadata:
      labels:
        app: jwz-agent-lab
    spec:
      nodeSelector:
        workload: cpu
      containers:
        - name: app
          image: papaperk/jwz-agent-lab:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: OLLAMA_BASE_URL
              value: http://ollama.default.svc.cluster.local:11434/v1
            - name: OLLAMA_MODEL
              value: llama3.2
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jwz-agent-lab
spec:
  type: LoadBalancer
  selector:
    app: jwz-agent-lab
  ports:
    - name: http
      port: 80
      targetPort: 8080
