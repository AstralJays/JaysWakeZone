# Reference manifest — Terraform applies equivalent via kubernetes_* resources.
# Image: public Docker Hub python:3.9-bullseye (no private registry).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwz-cve-flask
  labels:
    app: jwz-cve-flask
    lab: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwz-cve-flask
  template:
    metadata:
      labels:
        app: jwz-cve-flask
    spec:
      containers:
        - name: app
          image: python:3.9-bullseye
          imagePullPolicy: IfNotPresent
          env:
            - name: JWZ_LAB
              value: "5-kubernetes"
            - name: PORT
              value: "8080"
          command: ["bash", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir flask==2.0.3 werkzeug==2.0.3
              cat >/tmp/jwz_app.py <<'PY'
              import os
              from flask import Flask
              app = Flask(__name__)
              LAB = os.environ.get("JWZ_LAB", "5-kubernetes")
              @app.route("/")
              def index():
                  return {"status": "running", "demo": "cve-detection", "lab": LAB}
              @app.route("/health")
              def health():
                  return {"ok": True}
              app.run(host="0.0.0.0", port=int(os.environ.get("PORT", "8080")))
              PY
              exec python /tmp/jwz_app.py
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jwz-cve-flask
  labels:
    app: jwz-cve-flask
spec:
  type: LoadBalancer
  selector:
    app: jwz-cve-flask
  ports:
    - port: 80
      targetPort: 8080
