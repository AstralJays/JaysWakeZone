# Reference manifest — Terraform applies equivalent via kubernetes_* resources.
# Image: public Docker Hub opena2a/dvaa (no private registry).
# https://hub.docker.com/r/opena2a/dvaa
# https://github.com/opena2a-org/damn-vulnerable-ai-agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwz-dvaa
  labels:
    app: jwz-dvaa
    lab: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwz-dvaa
  template:
    metadata:
      labels:
        app: jwz-dvaa
    spec:
      containers:
        - name: dvaa
          image: opena2a/dvaa:0.9.2
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENA2A_TELEMETRY
              value: "off"
          ports:
            - name: dashboard
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jwz-dvaa
  labels:
    app: jwz-dvaa
spec:
  type: LoadBalancer
  selector:
    app: jwz-dvaa
  ports:
    - name: dashboard
      port: 80
      targetPort: 9000
