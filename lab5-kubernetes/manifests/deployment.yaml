# Reference — Terraform applies equivalent via kubernetes_* resources.
# Publish your image, then set container_image in terraform.tfvars.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwz-agent-lab
  labels:
    app: jwz-agent-lab
    lab: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwz-agent-lab
  template:
    metadata:
      labels:
        app: jwz-agent-lab
    spec:
      containers:
        - name: app
          image: YOURUSER/jwz-agent-lab:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: OLLAMA_MODEL
              value: llama3.2
            # Optional in-cluster Ollama Service:
            # - name: OLLAMA_BASE_URL
            #   value: http://ollama:11434/v1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jwz-agent-lab
spec:
  type: LoadBalancer
  selector:
    app: jwz-agent-lab
  ports:
    - name: http
      port: 80
      targetPort: 8080
